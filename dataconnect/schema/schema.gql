type Department @table {
  name: String!
  description: String
  costCenter: String
}

type Role @table {
  title: String!
  accessLevel: Int!
}

type Employee @table {
  firstName: String!
  lastName: String!
  email: String!
  role: Role!
  hireDate: Date!
  phoneNumber: String
  bio: String
  profileImageUrl: String
  department: Department
  manager: Employee
}

type Project @table {
  name: String!
  startDate: Date!
  endDate: Date
  status: String
}

type Assignment @table {
  employee: Employee!
  project: Project!
  roleOnProject: String!
}